  - date: 2026-09-20
    kind: measured
    heads:
      TTL: 1868087
      LDE: 0e7733e
      RBA: 6ca80f2
    note: >-
      One week of concentrated work on the assessment's own findings: what
      ships is now built by the same install that passed the tests, the
      cooldown reaches npm itself, and a red suite blocks a merge to `acc` in
      all three.
    scores:
      TTL: [1, 4, 3, 4, 0, 4, 4, 5, 4, 2, 1]
      LDE: [1, 3, 3, 4, 0, 4, 4, 4, 4, 2, 1]
      RBA: [2, 3, 2, 3, 0, 4, 3, 4, 3, 2, 1]
    changes:
      - component: TTL
        recommendation: R2
        from: 2
        to: 4
        why: >-
          Every job moved to `ubuntu-24.04`, the app is built on the runner and
          uploaded with `skip_app_build: true`, and `node-version: '24'` — a
          major only — became the exact `24.20.0`. What is left unpinned is the
          upload container, which no longer chooses a toolchain.
      - component: LDE
        recommendation: R2
        from: 2
        to: 3
        why: >-
          All 15 jobs on `ubuntu-24.04`, both frontends built on the runner with
          `skip_app_build: true`, and three drifting Node literals replaced by
          one exact `.nvmrc` at 22.23.2, closing #113.
      - component: RBA
        recommendation: R2
        from: 2
        to: 3
        why: >-
          All 16 jobs on `ubuntu-24.04` and the last floating `node-version: '24'`
          pinned to 24.20.0. Held at 3 because its container images — Skosmos,
          Operaton, Postgres, Keycloak, Redis — still carry tags, not digests.
      - component: TTL
        recommendation: R3
        from: 2
        to: 3
        why: >-
          No deploy path re-resolves a version range any more: the shipped bundle
          comes from the runner's `npm ci`. The manifest's 30 caret ranges are
          why it is not higher.
      - component: LDE
        recommendation: R3
        from: 2
        to: 3
        why: >-
          The backend deploys with `npm ci --omit=dev` from the root lockfile and
          the frontends are built on the runner, so no install re-resolves a
          range. The manifests still hold 77 caret ranges.
      - component: TTL
        recommendation: R4
        from: 3
        to: 4
        why: >-
          The one weak row is closed — the bundle that ships is the one `npm ci`
          produced on the runner. `pip install semgrep==1.176.1` and
          `npx --package renovate@44.50.3` resolve without hashes, which keeps it
          off 5.
      - component: LDE
        recommendation: R4
        from: 2
        to: 4
        why: >-
          Both weak rows are closed: the backend installs 349 packages with
          `npm ci --omit=dev` against the root lockfile's integrity hashes, and
          the frontend ships what the runner built.
      - component: TTL
        recommendation: R6
        from: 3
        to: 4
        why: >-
          A root `.npmrc` sets `min-release-age=14`, so the cooldown reaches npm
          itself and not only Renovate's proposals — including the lock-file
          refresh Renovate cannot hold back. On Node 24.20.0 its npm 11.19
          honours the setting.
      - component: LDE
        recommendation: R6
        from: 3
        to: 4
        why: >-
          The same `.npmrc` cooldown. Node 22.23.2 bundles npm 10.9.8, which
          ignores the setting silently, so `scripts/check-deps.sh` warns below
          npm 11.10.
      - component: RBA
        recommendation: R6
        from: 3
        to: 4
        why: >-
          The same `.npmrc` cooldown, with the same npm-version caveat. It does
          not reach the backend deploy, which installs in its own `deploy/`
          folder — counted against R3 and R4 rather than three times.
      - component: LDE
        recommendation: R7
        from: 3
        to: 4
        why: >-
          Minor updates of pre-1.0 packages now wait for approval, with the four
          packages named and the failure it prevents cited. That written
          assessment is what R7 asks for.
      - component: RBA
        recommendation: R8
        from: 3
        to: 4
        why: >-
          Twenty Renovate pull requests merged in 30 days, against seven a week
          earlier, and the first lock-file refresh merged on 14 September.
      - component: TTL
        recommendation: R9
        from: 3
        to: 4
        why: >-
          `Build and deploy ACC` — which runs lint, the suites with coverage and
          the build — is now a required check on `acc`.
      - component: LDE
        recommendation: R9
        from: 3
        to: 4
        why: >-
          `deploy`, `Build and Deploy Frontend` and `Build and Deploy ROPA Site`
          are required on `acc`, and both patterns match the lockfile, so a
          dependency pull request really does run them.
      - component: RBA
        recommendation: R9
        from: 2
        to: 3
        why: >-
          `scan`, `build` and the three ACC deploy checks became required on
          `acc`. Not 4: the three Static Web App filters do not match
          `package-lock.json`, so a lock-file refresh skips them — and a skipped
          check reports success.
      - component: RBA
        recommendation: R10
        from: 1
        to: 2
        why: >-
          Open Dependabot alerts fell from 154 to 8 when the first lock-file
          refresh landed. None is dismissed with a reason, and nothing audits on
          a schedule, so it goes no higher.

