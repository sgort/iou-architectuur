# Weekly assessment of the three applications against ICTU's eleven
# dependency recommendations. One record, several renderings: the tables and
# the charts on contributing/ictu-dependency-guideline.md are all generated
# from this file by hooks/kpi_charts.py.
#
# Scale: 0 absent or contradicted · 1 incidental only · 2 partly met, large
# gaps · 3 mostly met, a clear gap · 4 met, a small gap · 5 fully met, and
# enforced rather than intended.
#
# kind: measured      scored against the repositories on that date
# kind: reconstructed scored afterwards from the commits that were on `acc`
#                     that day — the shape of the curve is reliable, an
#                     individual cell is worth about ±1
#
# `heads` names the last commit on each repository's `acc` that day, which is
# what was read. `changes` records every cell that moved and why, so the chart
# can be read without opening the repositories.

recommendations:
  - id: R1
    group: Adding
    short: Vet maintenance before adding
  - id: R2
    group: Specifying
    short: No unpinned tags
  - id: R3
    short: Highest precision, no ranges
  - id: R4
    short: Hash pins, lockfile, `npm ci`
  - id: R5
    short: Internal registry; verified origin
  - id: R6
    group: Updating
    short: Cooldown of at least 7 days
  - id: R7
    short: Assess majors; wait for a patch
  - id: R8
    short: Periodic, tool-driven updates
  - id: R9
    short: Reviewed MR, whole pipeline, no automerge
  - id: R10
    group: Monitoring
    short: Daily audit, including releases
  - id: R11
    short: Quarterly maintenance check

